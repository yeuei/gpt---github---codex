version: coordination.v3
project:
  repository: yeuei/gpt---github---codex
  current_goal: local-first Dashboard with exact historical task snapshots and separated state domains
  dashboard_runtime: trigger/

sources:
  default: local_git
  background_network_access: false
  explicit_github_refresh:
    endpoint: /api/refresh-github
    command: git fetch <remote> --prune --quiet
    preserve_local_event_state_on_failure: true

history:
  task_snapshot:
    key: [pr_number, commit_sha]
    git_object: coordination/PR-<N>/任务.md
    exact_sha_only: true
    fallback_to_event_time: false
    fallback_to_current_task: false

state_domains:
  trigger_approval: approval_state
  delivery_execution: delivery_state
  github_pr: github_pr_state
  cross_domain_inference: forbidden
  legacy_unseparated_value: legacy_unknown

routing:
  event_trailers:
    origin: Coordination-Origin
    event_id: Coordination-Event-Id
    caused_by: Coordination-Caused-By
  event_id_dedup: true
  missing_pr_number: unassigned
  do_not_invent_pr_number: true

binding:
  version: binding.v1
  states: [pending, claimed, active, expired, revoked, conflict]
  one_active_per_target: true
  token_storage: local_hash_only
  share_token_location: url_fragment

approvals:
  trigger_event_approval_is_separate_from_codex_app_server: true
  codex_policy: workspace-write + on-request

security:
  dashboard_bind: 127.0.0.1
  secrets_in_git: forbidden
  browser_cookie_access: forbidden
